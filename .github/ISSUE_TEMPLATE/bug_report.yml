name: Bug report
description: Something is broken (usage numbers off, block did not appear, lock reset early...)
title: 'fix: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please never paste personal app data, keystores or passwords.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set limit to 30 minutes
        2. Open Instagram
        3. Wait until the limit is reached
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Usage tracking (numbers wrong)
        - Limit / settings
        - Blocking overlay
        - Lock / midnight reset
        - History & stats
        - Permissions / onboarding
        - Build / CI
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Lockout version
      placeholder: e.g. 0.3.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Tecno Spark 10, Android 13 (API 33)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: '`adb logcat` output or screenshots if available.'
      render: shell
    validations:
      required: false
