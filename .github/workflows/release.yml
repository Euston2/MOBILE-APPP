name: Release

# Tag-driven release: `git tag vX.Y.Z && git push origin vX.Y.Z` on `main`.
# Builds a signed APK and publishes it as a GitHub Release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    # `secrets` cannot be referenced directly from `if:` conditions. Expose a
    # boolean here and compare against it in the steps instead.
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Secrets required for a properly signed APK (see docs/RELEASING.md):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Until they are configured, Gradle falls back to the debug key so the
      # release pipeline still produces an installable APK.
      - name: Restore signing keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Write key.properties
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Warn about debug signing
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::No signing secrets configured - the APK is debug-signed and not suitable for distribution."

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VERSION"

      - name: Verify bundled SQLite library
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk |
            grep -q 'lib/arm64-v8a/libsqlite3.so'

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee apk-certs.txt
          if grep -q "CN=Android Debug" apk-certs.txt; then
            echo "::warning::Release APK is debug-signed. Configure release signing secrets before public distribution."
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/lockout-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/lockout-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
