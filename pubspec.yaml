name: lockout
description: "Lockout: a hard-limit social media usage tracker for Android."
publish_to: 'none'

# Semantic versioning: MAJOR.MINOR.PATCH+BUILD.
# Stage 0 is the project scaffold.
version: 1.2.0+12

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  drift: 2.30.0
  shared_preferences: ^2.5.6
  # 0.6.0+eol is a migration stub with no native libraries. 0.5.42 is the
  # last functional 2.x release and matches the sqlite3 version used by drift.
  sqlite3_flutter_libs: 0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.30.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true


